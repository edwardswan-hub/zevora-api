<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zevora 控制台</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --muted:#8b93a7; --text:#e9ecf3; --line:#2a3040; --accent:#6ba7ff; --ok:#4dd4ac; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    .app{max-width:1100px;margin:0 auto;padding:20px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
    .nav{display:flex;gap:10px;flex-wrap:wrap}.nav button{background:#1d2230;color:var(--text);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
    .nav button.active{border-color:var(--accent);color:var(--accent)}
    .card{background:var(--panel);border:1px solid var(--line);padding:16px;margin-top:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    h2,h3{margin:0 0 10px 0}.muted{color:var(--muted);font-size:13px}
    input,textarea{width:100%;background:#111521;border:1px solid var(--line);color:var(--text);padding:9px;margin:6px 0}
    textarea{min-height:110px;resize:vertical}
    button{background:var(--accent);border:none;color:#09101f;padding:9px 14px;cursor:pointer;font-weight:600}
    .btn2{background:#20283a;color:var(--text);border:1px solid var(--line)}
    .hidden{display:none}
    .list{max-height:260px;overflow:auto;border:1px solid var(--line);padding:10px;background:#111521}
    .pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);font-size:12px;margin-right:6px}

    /* 强制登录/注册遮罩 */
    .auth-mask{position:fixed;inset:0;background:rgba(10,12,16,.94);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
    .auth-box{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);padding:18px}
    .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}

    @media (max-width:900px){.grid,.grid3{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="authMask" class="auth-mask">
    <div class="auth-box">
      <h2>欢迎使用 Zevora</h2>
      <p class="muted">请先登录或注册（注册账号自动为访客，禁止注册管理员账号）。</p>
      <div class="tabs">
        <button id="tabLogin">登录</button>
        <button id="tabRegister" class="btn2">注册</button>
      </div>
      <div id="loginPane">
        <input id="loginUser" placeholder="用户名" />
        <input id="loginPass" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
      </div>
      <div id="registerPane" class="hidden">
        <input id="regUser" placeholder="新用户名（不能是 Julian）" />
        <input id="regPass" type="password" placeholder="密码（至少6位）" />
        <button id="registerBtn">注册账号</button>
      </div>
      <p id="authMsg" class="muted" style="margin-top:10px;"></p>
    </div>
  </div>

  <div class="app">
    <div class="top">
      <div>
        <strong>Zevora Console</strong>
        <div class="muted" id="whoami">未登录</div>
      </div>
      <div class="nav">
        <button class="active" data-view="overview">概览</button>
        <button data-view="ai">AI 助手</button>
        <button data-view="messages">留言板</button>
        <button data-view="admin">管理员</button>
        <button id="logoutBtn" class="btn2">退出</button>
      </div>
    </div>

    <section id="overview" class="view card">
      <h3>系统概览</h3>
      <div class="grid3">
        <div class="card"><div class="muted">当前用户</div><div id="ovUser">-</div></div>
        <div class="card"><div class="muted">角色</div><div id="ovRole">-</div></div>
        <div class="card"><div class="muted">访客权限</div><div id="ovPolicy">-</div></div>
      </div>
    </section>

    <section id="ai" class="view card hidden">
      <h3>AI 助手（SiliconFlow / Qwen）</h3>
      <p class="muted">Base URL: https://api.siliconflow.cn/v1 ，Model: Qwen/Qwen3-8B</p>
      <textarea id="aiPrompt" placeholder="输入你的问题..."></textarea>
      <button id="askAiBtn">发送给 AI</button>
      <div class="card" style="margin-top:12px;white-space:pre-wrap" id="aiReply">等待提问...</div>
    </section>

    <section id="messages" class="view card hidden">
      <h3>留言板</h3>
      <textarea id="msgInput" placeholder="写留言..."></textarea>
      <button id="sendMsgBtn">发送留言</button>
      <p id="msgStatus" class="muted"></p>
      <div class="list" id="msgList"></div>
    </section>

    <section id="admin" class="view card hidden">
      <h3>管理员通道</h3>
      <div id="adminDenied" class="muted">仅管理员可用。</div>
      <div id="adminBody" class="hidden">
        <div class="grid">
          <div class="card">
            <h3>访客策略</h3>
            <label><input type="checkbox" id="allowGuestAi"> 允许未登录访客使用 AI</label><br>
            <label><input type="checkbox" id="allowGuestMsg"> 允许未登录访客留言</label><br><br>
            <button id="savePolicyBtn">保存策略</button>
          </div>
          <div class="card">
            <h3>创建特邀访客</h3>
            <input id="ivUser" placeholder="访客用户名" />
            <input id="ivPass" placeholder="密码（可留空自动生成）" />
            <button id="createVisitorBtn">创建特邀访客</button>
            <div id="ivResult" class="muted" style="margin-top:8px"></div>
          </div>
        </div>
        <div class="card">
          <h3>所有访客</h3>
          <div id="visitorList" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const API = {
      token: localStorage.getItem('zevora_token') || '',
      role: localStorage.getItem('zevora_role') || '',
      username: localStorage.getItem('zevora_username') || ''
    };

    const authMask = document.getElementById('authMask');
    const authMsg = document.getElementById('authMsg');

    function headers(json = true){
      const h = {};
      if (json) h['Content-Type'] = 'application/json';
      if (API.token) h['Authorization'] = `Bearer ${API.token}`;
      return h;
    }

    function switchView(name){
      document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
      document.getElementById(name).classList.remove('hidden');
      document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
    }

    function renderIdentity(){
      document.getElementById('whoami').textContent = API.token ? `${API.username} (${API.role})` : '未登录';
      document.getElementById('ovUser').textContent = API.username || '-';
      document.getElementById('ovRole').textContent = API.role || '-';
      const isAdmin = API.role === 'admin';
      document.getElementById('adminDenied').classList.toggle('hidden', isAdmin);
      document.getElementById('adminBody').classList.toggle('hidden', !isAdmin);
    }

    function logout(){
      API.token=''; API.role=''; API.username='';
      localStorage.removeItem('zevora_token'); localStorage.removeItem('zevora_role'); localStorage.removeItem('zevora_username');
      authMask.classList.remove('hidden');
      renderIdentity();
    }

    async function doLogin(){
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const body = new URLSearchParams({username,password});
      const r = await fetch('/api/token',{method:'POST',body});
      if(!r.ok){authMsg.textContent='登录失败，请检查账号密码';return;}
      const d = await r.json();
      API.token=d.access_token; API.role=d.role; API.username=d.username;
      localStorage.setItem('zevora_token',API.token); localStorage.setItem('zevora_role',API.role); localStorage.setItem('zevora_username',API.username);
      authMask.classList.add('hidden');
      authMsg.textContent='';
      renderIdentity();
      await loadMessages();
      await loadPolicy();
      await loadVisitors();
    }

    async function doRegister(){
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      const r = await fetch('/api/register',{method:'POST',headers:headers(true),body:JSON.stringify({username,password})});
      if(!r.ok){
        const e = await r.json().catch(()=>({}));
        authMsg.textContent = `注册失败: ${e.detail || r.status}`;
        return;
      }
      authMsg.textContent='注册成功，请切换到登录并进入系统';
    }

    async function askAI(){
      const prompt = document.getElementById('aiPrompt').value.trim();
      if(!prompt) return;
      const r = await fetch('/api/ai/chat',{method:'POST',headers:headers(true),body:JSON.stringify({prompt})});
      const box = document.getElementById('aiReply');
      if(!r.ok){ const e=await r.json().catch(()=>({})); box.textContent=`请求失败: ${e.detail||r.status}`; return; }
      const d = await r.json(); box.textContent = d.reply;
    }

    async function sendMessage(){
      const content = document.getElementById('msgInput').value.trim(); if(!content) return;
      const r = await fetch('/api/messages',{method:'POST',headers:headers(true),body:JSON.stringify({content})});
      const s = document.getElementById('msgStatus');
      if(!r.ok){ const e=await r.json().catch(()=>({})); s.textContent=`发送失败: ${e.detail||r.status}`; return; }
      s.textContent='发送成功'; document.getElementById('msgInput').value=''; await loadMessages();
    }

    async function loadMessages(){
      const r = await fetch('/api/messages'); if(!r.ok) return;
      const d = await r.json();
      const html = d.items.map(i=>`<div style="margin-bottom:8px"><span class="pill">${i.author}</span>${i.content}</div>`).join('') || '暂无留言';
      document.getElementById('msgList').innerHTML = html;
    }

    async function loadPolicy(){
      const r = await fetch('/api/admin/overview',{headers:headers(false)});
      if(!r.ok){document.getElementById('ovPolicy').textContent='普通用户不可见';return;}
      const d = await r.json();
      document.getElementById('allowGuestAi').checked = !!d.settings.allow_guest_ai;
      document.getElementById('allowGuestMsg').checked = !!d.settings.allow_guest_messages;
      document.getElementById('ovPolicy').textContent = `AI:${d.settings.allow_guest_ai?'开':'关'} / 留言:${d.settings.allow_guest_messages?'开':'关'}`;
    }

    async function savePolicy(){
      const body = {allow_guest_ai:document.getElementById('allowGuestAi').checked,allow_guest_messages:document.getElementById('allowGuestMsg').checked};
      await fetch('/api/admin/settings',{method:'PATCH',headers:headers(true),body:JSON.stringify(body)});
      await loadPolicy();
    }

    async function createVisitor(){
      const username = document.getElementById('ivUser').value.trim();
      const password = document.getElementById('ivPass').value.trim();
      const r = await fetch('/api/admin/visitors',{method:'POST',headers:headers(true),body:JSON.stringify({username,password:password||null})});
      const out = document.getElementById('ivResult');
      if(!r.ok){ const e=await r.json().catch(()=>({})); out.textContent=`创建失败: ${e.detail||r.status}`; return; }
      const d = await r.json(); out.textContent = `创建成功 -> ${d.username} / ${d.password}`; await loadVisitors();
    }

    async function loadVisitors(){
      const r = await fetch('/api/admin/visitors',{headers:headers(false)});
      if(!r.ok){document.getElementById('visitorList').innerHTML='需要管理员权限'; return;}
      const d = await r.json();
      document.getElementById('visitorList').innerHTML = d.items.map(i=>`<div><span class='pill'>${i.source}</span><strong>${i.username}</strong> · ${i.enabled?'启用':'禁用'} · ${i.created_at||'-'}</div>`).join('') || '暂无访客';
    }

    // 导航
    document.querySelectorAll('.nav button[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

    // 登录/注册tab
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    tabLogin.addEventListener('click',()=>{
      document.getElementById('loginPane').classList.remove('hidden');
      document.getElementById('registerPane').classList.add('hidden');
      tabLogin.classList.remove('btn2'); tabRegister.classList.add('btn2');
    });
    tabRegister.addEventListener('click',()=>{
      document.getElementById('registerPane').classList.remove('hidden');
      document.getElementById('loginPane').classList.add('hidden');
      tabRegister.classList.remove('btn2'); tabLogin.classList.add('btn2');
    });

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('registerBtn').addEventListener('click', doRegister);
    document.getElementById('askAiBtn').addEventListener('click', askAI);
    document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
    document.getElementById('savePolicyBtn').addEventListener('click', savePolicy);
    document.getElementById('createVisitorBtn').addEventListener('click', createVisitor);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    renderIdentity();
    loadMessages();
    if (API.token) { authMask.classList.add('hidden'); loadPolicy(); loadVisitors(); }
  </script>
</body>
</html>
