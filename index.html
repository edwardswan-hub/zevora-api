<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zevora 控制台</title>
  <style>
    :root {
      --bg: #f8f8f6;
      --fg: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --card: #ffffff;
      --accent: #111827;
      --accent-invert: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #111827;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #374151;
      --card: #1f2937;
      --accent: #e5e7eb;
      --accent-invert: #111827;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      line-height: 1.6;
      transition: .2s;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .title { font-size: 1.25rem; font-weight: 700; }
    .muted { color: var(--muted); font-size: .92rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    button, input, textarea {
      font: inherit;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      padding: 8px 10px;
    }
    textarea { width: 100%; min-height: 90px; resize: vertical; }
    button { cursor: pointer; }
    .primary {
      background: var(--accent);
      color: var(--accent-invert);
      border-color: var(--accent);
    }

    .tabs { display: flex; gap: 8px; }
    .tabs button.active { border-color: var(--fg); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
    }
    .hidden { display: none !important; }

    .list {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: .92rem;
    }

    .message-item { margin-bottom: 8px; }
    .message-item b { margin-right: 6px; }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <div class="title">Zevora Console</div>
        <div id="whoami" class="muted">未登录</div>
      </div>
      <button id="themeBtn">切换深色模式</button>
    </header>

    <div class="toolbar tabs">
      <button class="active" data-view="overview">概览</button>
      <button data-view="ai">AI 助手</button>
      <button data-view="messages">留言板</button>
      <button data-view="admin">管理员</button>
    </div>

    <section id="overview" class="card view">
      <h3>登录 / 注册</h3>
      <div class="grid">
        <div>
          <input id="loginUsername" placeholder="用户名" />
          <input id="loginPassword" type="password" placeholder="密码" />
          <button class="primary" id="loginBtn">登录</button>
          <button id="logoutBtn">退出</button>
          <div id="authInfo" class="muted" style="margin-top:8px;">未登录</div>
        </div>
        <div>
          <input id="regUser" placeholder="新用户名（至少3位）" />
          <input id="regPass" type="password" placeholder="密码（至少6位）" />
          <button class="primary" id="registerBtn">注册访客账号</button>
          <div id="registerInfo" class="muted" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <section id="ai" class="card view hidden">
      <h3>AI 助手</h3>
      <p class="muted">未配置 OPENAI_API_KEY 时会返回 503。</p>
      <textarea id="aiPrompt" placeholder="输入你的问题..."></textarea>
      <button class="primary" id="askAiBtn">发送</button>
      <div id="aiReply" class="list">等待提问...</div>
    </section>

    <section id="messages" class="card view hidden">
      <h3>留言板</h3>
      <textarea id="messageInput" placeholder="写留言..."></textarea>
      <button class="primary" id="sendMessageBtn">发送留言</button>
      <div id="messageStatus" class="muted" style="margin-top:8px;"></div>
      <div id="messageList" class="list">加载中...</div>
    </section>

    <section id="admin" class="card view hidden">
      <h3>管理员</h3>
      <div id="adminDenied" class="muted">仅管理员可见。</div>
      <div id="adminBody" class="hidden">
        <label><input type="checkbox" id="allowGuestAiChk" /> 允许访客使用 AI</label><br />
        <label><input type="checkbox" id="allowGuestMsgChk" /> 允许访客留言</label><br />
        <button id="saveSettingsBtn" class="primary" style="margin-top:8px;">保存策略</button>

        <hr style="border:0;border-top:1px solid var(--border);margin:14px 0;" />

        <input id="newVisitorName" placeholder="访客用户名" />
        <button id="createVisitorBtn" class="primary">创建访客</button>
        <div id="visitorCreated" class="muted" style="margin-top:8px;"></div>
        <div id="visitorList" class="list"></div>
      </div>
    </section>
  </div>

  <script>
    const API = {
      token: localStorage.getItem('zevora_token') || '',
      role: localStorage.getItem('zevora_role') || '',
      username: localStorage.getItem('zevora_username') || ''
    };

    function headers(isJson = true) {
      const h = {};
      if (isJson) h['Content-Type'] = 'application/json';
      if (API.token) h.Authorization = `Bearer ${API.token}`;
      return h;
    }

    function switchView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(name).classList.remove('hidden');
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === name);
      });
    }

    function updateAuthUI() {
      const loggedIn = Boolean(API.token);
      document.getElementById('whoami').textContent = loggedIn ? `${API.username} (${API.role})` : '未登录';
      document.getElementById('authInfo').textContent = loggedIn ? `已登录: ${API.username} (${API.role})` : '未登录';
      const isAdmin = API.role === 'admin';
      document.getElementById('adminDenied').classList.toggle('hidden', isAdmin);
      document.getElementById('adminBody').classList.toggle('hidden', !isAdmin);
    }

    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const body = new URLSearchParams({ username, password });
      const res = await fetch('/api/token', { method: 'POST', body });
      if (!res.ok) {
        document.getElementById('authInfo').textContent = '登录失败，请检查账号密码';
        return;
      }
      const data = await res.json();
      API.token = data.access_token;
      API.role = data.role;
      API.username = data.username;
      localStorage.setItem('zevora_token', API.token);
      localStorage.setItem('zevora_role', API.role);
      localStorage.setItem('zevora_username', API.username);
      updateAuthUI();
      await loadMessages();
      await loadAdminOverview();
    }

    async function registerUser() {
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      const info = document.getElementById('registerInfo');
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: headers(true),
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        info.textContent = `注册失败: ${err.detail || res.status}`;
        return;
      }
      info.textContent = '注册成功，请使用新账号登录。';
    }

    function logout() {
      API.token = '';
      API.role = '';
      API.username = '';
      localStorage.removeItem('zevora_token');
      localStorage.removeItem('zevora_role');
      localStorage.removeItem('zevora_username');
      updateAuthUI();
    }

    async function askAI() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      if (!prompt) return;
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: headers(true),
        body: JSON.stringify({ prompt })
      });
      const box = document.getElementById('aiReply');
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        box.textContent = `请求失败: ${err.detail || res.status}`;
        return;
      }
      const data = await res.json();
      box.textContent = data.reply;
    }

    async function sendMessage() {
      const content = document.getElementById('messageInput').value.trim();
      if (!content) return;
      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: headers(true),
        body: JSON.stringify({ content })
      });
      const status = document.getElementById('messageStatus');
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        status.textContent = `发送失败: ${err.detail || res.status}`;
        return;
      }
      status.textContent = '发送成功';
      document.getElementById('messageInput').value = '';
      await loadMessages();
    }

    async function loadMessages() {
      const res = await fetch('/api/messages');
      if (!res.ok) return;
      const data = await res.json();
      const html = data.items.map(i => `<div class="message-item"><b>${i.author}</b>${i.content}</div>`).join('') || '暂无留言';
      document.getElementById('messageList').innerHTML = html;
    }

    async function loadAdminOverview() {
      if (API.role !== 'admin') return;
      const res = await fetch('/api/admin/overview', { headers: headers(false) });
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('allowGuestAiChk').checked = !!data.settings.allow_guest_ai;
      document.getElementById('allowGuestMsgChk').checked = !!data.settings.allow_guest_messages;
      await loadVisitors();
    }

    async function saveSettings() {
      const res = await fetch('/api/admin/settings', {
        method: 'PATCH',
        headers: headers(true),
        body: JSON.stringify({
          allow_guest_ai: document.getElementById('allowGuestAiChk').checked,
          allow_guest_messages: document.getElementById('allowGuestMsgChk').checked
        })
      });
      if (!res.ok) return;
      await loadAdminOverview();
    }

    async function createVisitor() {
      const username = document.getElementById('newVisitorName').value.trim();
      if (!username) return;
      const res = await fetch('/api/admin/visitors', {
        method: 'POST',
        headers: headers(true),
        body: JSON.stringify({ username })
      });
      const out = document.getElementById('visitorCreated');
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        out.textContent = `创建失败: ${err.detail || res.status}`;
        return;
      }
      const data = await res.json();
      out.textContent = `已创建: ${data.username} / 密码: ${data.password}`;
      await loadVisitors();
    }

    async function loadVisitors() {
      const res = await fetch('/api/admin/visitors', { headers: headers(false) });
      if (!res.ok) return;
      const data = await res.json();
      const html = data.items.map(i => `${i.username} (${i.enabled ? 'enabled' : 'disabled'})`).join('<br>') || '暂无访客账号';
      document.getElementById('visitorList').innerHTML = html;
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('zevora_theme', next);
    }

    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('registerBtn').addEventListener('click', registerUser);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('askAiBtn').addEventListener('click', askAI);
    document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
    document.getElementById('createVisitorBtn').addEventListener('click', createVisitor);
    document.getElementById('themeBtn').addEventListener('click', toggleTheme);

    document.documentElement.setAttribute('data-theme', localStorage.getItem('zevora_theme') || 'light');
    updateAuthUI();
    loadMessages();
    loadAdminOverview();
  </script>
</body>
</html>
